<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Lora";src:url(fonts/lora.woff2) format("woff2");font-weight:500 700}
@font-face{font-family:"Libre Franklin";src:url(fonts/libre-franklin.woff2) format("woff2");font-weight:300 800}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(800px 360px at 92% -10%,rgba(217,164,65,.26),transparent 62%),radial-gradient(700px 320px at 0% 120%,rgba(108,208,165,.18),transparent 60%),linear-gradient(180deg,#0F2D29,#173F39);color:#EEF5F2;font-family:"Libre Franklin",sans-serif;position:relative}
body::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
.in{position:relative;z-index:1;padding:56px 72px}
.logo{display:flex;align-items:center;gap:16px;font-family:Lora;font-weight:700;font-size:40px}
.logo b{color:#D9A441;font-weight:inherit}.logo svg{width:64px;height:64px}

p{font-size:30px;color:#A9C3BA;margin:0;max-width:900px}
.tags{display:flex;gap:14px;margin-top:34px}
.tags span{border:2px solid rgba(217,164,65,.6);color:#E8BC63;border-radius:10px;padding:8px 16px;font-weight:700;font-size:22px;letter-spacing:.05em}
.card{position:absolute;right:64px;bottom:58px;z-index:1;background:#fff;color:#14231F;border-radius:16px;padding:18px 22px;width:330px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.card b{display:block;font-size:22px}.card small{display:block;color:#56655F;font-size:17px;margin:4px 0 10px}
.card i{font-style:normal;display:inline-block;background:#DDF0E6;color:#17694F;font-weight:800;font-size:16px;border-radius:99px;padding:4px 12px}
