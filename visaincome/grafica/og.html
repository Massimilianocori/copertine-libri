<!DOCTYPE html>

*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#F4F5F9;

.l{position:absolute;left:72px;top:66px;width:640px}

.brand svg{width:62px;height:62px}
.brand b{color:#E0A526}
.eye{margin-top:58px;font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#E0A526}
h1{font-family:"IBM Plex Serif";font-size:70px;line-height:1.04;letter-spacing:-.02em;margin:14px 0 22px}
p{font-size:27px;line-height:1.38;color:#BFC6E0;margin:0}
.card{position:absolute;right:70px;top:92px;width:380px;overflow:hidden;background:#FBF8EF;color:#141B33;border-radius:22px;padding:30px 30px 26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}

.lab{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#596282}
.row{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:600;padding:15px 0;border-bottom:1px dashed #C9CFE0}
.row:last-child{border-bottom:0}
.row i{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:#E8ECFA;color:#2A3D8F;flex:none}
.row svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ok{margin-top:16px;display:flex;align-items:center;gap:10px;background:#E2F4EA;color:#126B41;border-radius:12px;padding:12px 14px;font-size:21px;font-weight:700}
.ok svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
