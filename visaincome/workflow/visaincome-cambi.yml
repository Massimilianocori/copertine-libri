name: Visa Income Checker – cambi BCE

# Ogni giorno lavorativo legge i cambi di riferimento della BCE e aggiorna visaincome/dati/cambi.json
# sul branch di lavoro. Le pagine del sito leggono quel file da raw.githubusercontent.com: il sito su Netlify
# NON si ripubblica (la regola "ignore" di visaincome/sito/netlify.toml guarda solo visaincome/sito), quindi zero crediti.
# I workflow programmati partono solo dal branch principale (main): per attivarlo, copiare questo file in
# .github/workflows/visaincome-cambi.yml sul branch main.

on:
  schedule:
    - cron: "40 15 * * 1-5"   # 17:40 ora italiana d'estate (16:40 d'inverno): la BCE pubblica verso le 16:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: visaincome-cambi
  cancel-in-progress: false

jobs:
  cambi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-b7fd6b9e-n096cr
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cambi BCE
        run: python3 visaincome/raccolta/cambi.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visaincome/dati/cambi.json
          if git diff --cached --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git commit -m "Visa Income Checker: cambi BCE del $(date +%d/%m/%Y)"
          for i in 1 2 3 4; do
            if git pull --rebase origin ccr-b7fd6b9e-n096cr && git push origin HEAD:ccr-b7fd6b9e-n096cr; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
