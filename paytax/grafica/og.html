<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Source Serif 4";src:url(fonts/source-serif-4.woff2) format("woff2");font-weight:200 900}
@font-face{font-family:"Public Sans";src:url(fonts/public-sans.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(640px 380px at 92% -10%,rgba(224,149,43,.45),transparent 64%),radial-gradient(720px 340px at -4% 130%,rgba(79,201,179,.28),transparent 62%),linear-gradient(180deg,#0C2F2B,#11403A);color:#EEF4F1;font-family:"Public Sans",sans-serif;position:relative}
.in{position:relative;z-index:1;padding:70px 72px}
.logo{display:flex;align-items:center;gap:16px;font-family:"Source Serif 4";font-weight:700;font-size:38px}
.logo b{color:#E0952B;font-weight:inherit}.logo svg{width:64px;height:64px}
h1{font-family:"Source Serif 4";font-weight:700;font-size:60px;line-height:1.06;letter-spacing:-.015em;margin:44px 0 20px;max-width:620px}
p{font-size:26px;color:#B4C7C0;margin:0;max-width:600px}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px;max-width:620px}
.tags span{border:2px solid rgba(224,149,43,.75);color:#F0AA4E;border-radius:10px;padding:6px 12px;font-weight:800;font-size:19px;letter-spacing:.05em}
.card{position:absolute;right:64px;top:150px;z-index:1;background:#fff;color:#13201E;border-radius:18px;padding:22px 26px;width:350px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.card h2{margin:0 0 12px;font-size:18px;color:#57655F;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.row{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;gap:10px;font-size:20px;margin:7px 0;font-weight:700}
.row i{display:block;height:13px;border-radius:7px;background:#0B6B5D}.row span{text-align:right;font-variant-numeric:tabular-nums}
</style></head><body><div class="in">
<div class="logo"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#0C2F2B" stroke="#4FC9B3" stroke-opacity=".35"/><path d="M8 31h24" stroke="#4FC9B3" stroke-width="2" stroke-linecap="round" opacity=".55"/><rect x="8.5" y="20" width="3.4" height="9" rx="1" fill="#4FC9B3"/><rect x="14.2" y="15" width="3.4" height="14" rx="1" fill="#4FC9B3"/><rect x="19.9" y="9" width="3.4" height="20" rx="1" fill="#E0952B"/><rect x="25.6" y="13" width="3.4" height="16" rx="1" fill="#4FC9B3"/></svg><span>Payroll Tax <b>by State</b></span></div>

<div class="row"><b>WA</b><i style="width:40%"></i><span>$1m</span></div>

</body></html>
