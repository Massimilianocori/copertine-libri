<!DOCTYPE html>

@font-face{font-family:"DM Mono";font-weight:400;src:url(fonts/dm-mono-400.woff2) format("woff2")}
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#F2F4F7;background:linear-gradient(180deg,#14181D,#1E242B);border-bottom:12px solid #FFC72C}
.l{position:absolute;left:72px;top:64px;width:620px}
.brand{display:flex;align-items:center;gap:16px;font-family:"Outfit";font-size:38px}
.brand svg{width:64px;height:64px}
.brand b{color:#FFC72C}
.eye{display:flex;align-items:center;gap:14px;margin-top:62px;font-family:"DM Mono";font-size:21px;letter-spacing:.16em;text-transform:uppercase;color:#FFC72C}
.eye:before{content:"";width:34px;height:4px;background:#FFC72C}

p{font-size:27px;line-height:1.38;color:#AFB7C2;margin:0}
.board{position:absolute;right:66px;top:76px;width:420px;display:grid;gap:14px}
.row{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px 20px}
.sq{display:grid;place-items:center;width:64px;height:64px;border-radius:12px;background:#FFC72C;color:#14181D;flex:none}
.sq svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.row b{display:block;font-family:"Outfit";font-size:29px;line-height:1.1}
.row span{display:block;font-family:"DM Mono";font-size:17px;letter-spacing:.06em;color:#AFB7C2;margin-top:6px;text-transform:uppercase}
